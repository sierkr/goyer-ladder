<!DOCTYPE html>
<html>
<head><title>Icon Generator</title></head>
<body>
<h3>Klik op de links om de iconen te downloaden:</h3>
<canvas id="c512" width="512" height="512" style="display:none"></canvas>
<canvas id="c192" width="192" height="192" style="display:none"></canvas>
<canvas id="c180" width="180" height="180" style="display:none"></canvas>
<div id="links"></div>
<script>
const img = new Image();
img.onload = function() {
  [['c512',512,'icon-512.png'],['c192',192,'icon-192.png'],['c180',180,'icon-180.png']].forEach(([id,size,fname]) => {
    const c = document.getElementById(id);
    const ctx = c.getContext('2d');
    const r = size * 0.18;
    ctx.beginPath();
    ctx.moveTo(r,0); ctx.lineTo(size-r,0);
    ctx.arcTo(size,0,size,r,r);
    ctx.lineTo(size,size-r);
    ctx.arcTo(size,size,size-r,size,r);
    ctx.lineTo(r,size);
    ctx.arcTo(0,size,0,size-r,r);
    ctx.lineTo(0,r);
    ctx.arcTo(0,0,r,0,r);
    ctx.closePath();
    ctx.clip();
    ctx.drawImage(img, 0, 0, size, size);
    const a = document.createElement('a');
    a.href = c.toDataURL('image/png');
    a.download = fname;
    a.textContent = '⬇ Download ' + fname + ' (' + size + 'x' + size + ')';
    a.style = 'display:block;margin:10px 0;font-family:sans-serif;font-size:16px';
    document.getElementById('links').appendChild(a);
  });
};
img.src = 'icon.svg';
</script>
</body>
</html>
