name: Tests

# Draait bij elke push en bij elk pull request. Faalt er iets, dan zie je een
# rood kruis bij je commit op GitHub en krijg je een mail.
on:
  push:
  pull_request:
  workflow_dispatch:      # handmatig starten kan ook, via het tabblad Actions

jobs:

  # ── Laag 0: knopkoppelingen. Heeft niets nodig, dus als eerste. ──
  # v5.44.0. De app roept functies aan vanuit onclick="naam()". Dat is voor elke
  # controleur gewone tekst; een kapotte koppeling ziet niemand en de knop doet
  # dan niets. Op 25 september 2026 hing "Nu updaten" aan zo'n naam en werd een
  # open partijformulier stil weggegooid.
  knoppen:
    name: Knopkoppelingen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Knopkoppelingen controleren
        run: node tests/onclick-check.cjs

  # ── Laag 1: rekentests. Snel, geen emulator nodig. ──────────
  rekenkern:
    name: Rekenkern (unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests draaien
        run: node tests/run.cjs

  # ── Laag 1b: de linter. Vindt namen die niet bestaan. ───────
  # v5.44.0. Dit is de enige laag die de fout van v5.43.0 zonder browser had
  # gevonden: één verwijzing naar een weggehaalde variabele bleef staan, de hele
  # toernooi-scorekaart werd niet meer getekend, en alle rekentests bleven groen.
  linter:
    name: Linter (namen die niet bestaan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testgereedschap installeren
        run: npm install --prefix tests
      - name: Linter draaien
        run: ./tests/node_modules/.bin/eslint --config tests/eslint.config.mjs --no-config-lookup js sw.js tests

  # ── Laag 2 en 3: regels en functies tegen de emulator ───────
  emulator:
    name: Regels en Cloud Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Testgereedschap installeren
        run: npm install --prefix tests

      - name: Functie-dependencies installeren
        run: npm install --prefix functions

      - name: Emulators cachen
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: emulators-${{ runner.os }}

      # Het programma heet 'firebase', niet 'firebase-tools'. Rechtstreeks via
      # het pad aanroepen is betrouwbaarder dan npx.
      - name: Firestore-regels testen
        run: >
          ./tests/node_modules/.bin/firebase emulators:exec
          --project demo-goyer --only firestore
          "node tests/emulator/rules.test.cjs"

      - name: Cloud Functions testen
        env:
          GCLOUD_PROJECT: demo-goyer
        run: >
          ./tests/node_modules/.bin/firebase emulators:exec
          --project demo-goyer --only firestore,auth,functions
          "node tests/emulator/functions.test.cjs"

  # ── Laag 4: browsertests ───────────────────────────────────
  browser:
    name: Browser (end-to-end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Testgereedschap installeren
        run: npm install --prefix tests

      - name: Functie-dependencies installeren
        run: npm install --prefix functions

      - name: Browser installeren
        run: ./tests/node_modules/.bin/playwright install --with-deps chromium

      - name: Emulators cachen
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: emulators-${{ runner.os }}

      - name: Browsertests draaien
        env:
          GCLOUD_PROJECT: demo-goyer
          CI: 'true'
        run: >
          ./tests/node_modules/.bin/firebase emulators:exec
          --project demo-goyer --only firestore,auth,functions
          "node tests/e2e/seed.cjs && ./tests/node_modules/.bin/playwright test --config=playwright.config.cjs"

      - name: Rapport bewaren bij een fout
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-rapport
          path: |
            playwright-report/
            test-results/
          retention-days: 14
