<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Golf Score</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#000;color:#fff;font-family:-apple-system,sans-serif;font-size:16px}
  #app{height:100%;display:flex;flex-direction:column;overflow:hidden}

  /* ── Code invoer ── */
  #screen-login{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;padding:20px}
  #screen-login h1{font-size:16px;font-weight:600;text-align:center}
  #screen-login p{font-size:11px;color:#8e8e93;text-align:center;line-height:1.5}
  .code-input{background:#1c1c1e;border:2px solid #3a3a3c;border-radius:14px;color:#fff;font-size:28px;font-weight:700;letter-spacing:6px;padding:10px 8px;width:100%;outline:none;text-align:center}
  .code-input:focus{border-color:#1a5c38}
  .w-btn{background:#1a5c38;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;padding:13px;width:100%;cursor:pointer}
  .w-btn:active{opacity:.75}
  .w-btn.secondary{background:#2c2c2e;color:#8e8e93}
  #login-error{font-size:11px;color:#ff453a;text-align:center;min-height:16px}

  /* ── Geen partij ── */
  #screen-leeg{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;padding:20px;text-align:center}
  #screen-leeg h2{font-size:16px;font-weight:500}
  #screen-leeg p{font-size:12px;color:#8e8e93}

  /* ── Vaste header (beide schermen) ── */
  .fixed-hdr{
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 10px 6px;
    gap:6px;
    background:#000;
  }
  .fixed-hdr{position:relative}
  .hole-label{font-size:13px;font-weight:700;color:#fff;margin-left:8px}
  .hole-badge{position:absolute;left:50%;transform:translateX(-50%);background:#1a5c38;color:#fff;font-size:12px;font-weight:700;padding:4px 12px;border-radius:20px;white-space:nowrap;pointer-events:none}
  .hdr-btn{background:#2c2c2e;color:#fff;border:none;border-radius:10px;font-size:11px;font-weight:600;padding:5px 10px;cursor:pointer;white-space:nowrap;min-width:58px}
  .hdr-btn:active{opacity:.7}
  .hdr-btn.primary{background:#1a5c38}
  .hdr-spacer{min-width:58px}

  /* ── Scroll-body ── */
  .scroll-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 8px 8px;width:100%;box-sizing:border-box}

  /* ── Speler rijen ── */
  .player-row{display:flex;align-items:center;background:#1c1c1e;border-radius:14px;padding:9px 10px;gap:8px;border:1.5px solid transparent;margin-bottom:7px}
  .player-row.filled{border-color:#1a5c38}
  .av{width:30px;height:30px;border-radius:50%;background:#2c2c2e;display:flex;align-items:center;justify-content:center;font-size:10px;color:#8e8e93;font-weight:700;flex-shrink:0}
  .av.done{background:#1a5c38;color:#fff}
  .pname{flex:1;font-size:14px;color:#8e8e93;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .pname.done{color:#fff}
  .score-ctrl{display:flex;align-items:center;gap:6px;flex-shrink:0}
  .sc-btn{width:38px;height:38px;border-radius:50%;background:#3a3a3c;border:none;color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;line-height:1}
  .sc-btn:active{background:#666}
  .sc-num{font-size:20px;font-weight:700;min-width:26px;text-align:center;color:#636366}
  .sc-num.done{color:#fff}

  /* ── Nav onderaan score ── */
  .nav-row{display:flex;gap:7px;padding:6px 10px 10px;flex-shrink:0;background:#000}
  .nav-btn{flex:1;padding:11px 0;border-radius:12px;border:none;font-size:12px;font-weight:700;cursor:pointer;background:#2c2c2e;color:#8e8e93}
  .nav-btn.primary{background:#1a5c38;color:#fff}
  .nav-btn.secondary{background:#2c2c2e;color:#8e8e93}
  .nav-btn.small{flex:0 0 52px;font-size:18px;font-weight:700}
  .nav-btn:active{opacity:.7}

  /* ── Stand scherm ── */
  .match-card{background:#1c1c1e;border-radius:14px;padding:10px 11px;display:flex;flex-direction:column;gap:5px;margin-bottom:7px}
  .match-top{display:flex;justify-content:space-between;align-items:center;gap:6px}
  .m-name{font-size:12px;color:#fff;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .m-name.win{font-weight:700}
  .m-name.right{text-align:right}
  .m-score{font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px;background:#2c2c2e;color:#fff;white-space:nowrap;flex-shrink:0}
  .m-sub{font-size:10px;color:#636366;text-align:center}
  .stand-sub-label{font-size:11px;color:#8e8e93;text-align:center;padding:2px 0 8px}

  /* ── Loading ── */
  #screen-loading{flex:1;display:flex;align-items:center;justify-content:center;color:#8e8e93;font-size:13px}

  .hidden{display:none!important}
</style>
</head>
<body>
<div id="app">
  <div id="screen-loading">Laden…</div>

  <!-- Code invoer -->
  <div id="screen-login" class="hidden">
    <h1>⛳ Golf Score</h1>
    <p>Vul de 4-cijferige code in<br>uit de Ronde tab van de app</p>
    <input class="code-input" id="inp-code" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="0000" autocomplete="off">
    <div id="login-error"></div>
    <button class="w-btn" onclick="doLogin()">Ga naar partij</button>
  </div>

  <!-- Geen partij -->
  <div id="screen-leeg" class="hidden">
    <h2>Geen actieve partij</h2>
    <p>Start een partij via de app op je telefoon.</p>
    <button class="w-btn secondary" style="margin-top:8px" onclick="doLogout()">Uitloggen</button>
  </div>

  <!-- Score scherm -->
  <div id="screen-score" class="hidden" style="display:flex;flex-direction:column;height:100%">
    <div class="fixed-hdr">
      <button class="hdr-btn" id="btn-prev-hdr" onclick="vorigeHole()">✕</button>
      <span class="hole-label">Hole <span id="w-hn">1</span></span>
      <span class="hdr-spacer"></span>
    </div>
    <div class="scroll-body" id="w-spelers"></div>
    <div class="nav-row">
      <button class="nav-btn secondary" onclick="toonStand()">Stand ↗</button>
      <button class="nav-btn primary small" onclick="volgendeHole()">→</button>
    </div>
  </div>

  <!-- Stand scherm -->
  <div id="screen-stand" class="hidden" style="display:flex;flex-direction:column;height:100%">
    <div class="fixed-hdr">
      <button class="hdr-btn" onclick="toonScore()">← Scores</button>
      <span class="hole-badge">Stand</span>
      <span class="hdr-spacer"></span>
    </div>
    <div class="scroll-body">
      <div class="stand-sub-label" id="w-stand-sub">na hole 0</div>
      <div id="w-matches"></div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInAnonymously }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, getDocs, onSnapshot, doc, setDoc, updateDoc }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC6V0NOSgAtX_bDWezca-_F7gb3RANSens",
  authDomain: "goyer-golf-mp-ladder.firebaseapp.com",
  projectId: "goyer-golf-mp-ladder",
  storageBucket: "goyer-golf-mp-ladder.firebasestorage.app",
  messagingSenderId: "124116031878",
  appId: "1:124116031878:web:10d9b113b1afcd1dc73407"
};
const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

// Anoniem inloggen zodat Firestore leesbaar is
signInAnonymously(auth).catch(e => console.warn('anon:', e));

// ── State ──────────────────────────────────────────────────
let actievePartij    = null;
let ladderId         = null;
let holeIdx          = 0;
let ladderUnsub      = null;
const alleLadderPartijen = new Map(); // ladderId → actievePartijen array

// ── Helpers ────────────────────────────────────────────────
function voornaam(naam) {
  if (!naam) return '?';
  return naam.trim().split(/\s+/)[0];
}
function kortNaamUniek(naam, alleNamen) {
  if (!naam) return '?';
  const d = naam.trim().split(/\s+/);
  const vn = d[0];
  // Alleen achternaamletter toevoegen als voornaam niet uniek is
  const duplicaat = alleNamen.filter(n => n && n.trim().split(/\s+/)[0] === vn).length > 1;
  if (d.length === 1 || !duplicaat) return vn;
  return vn + ' ' + d[d.length - 1][0].toUpperCase() + '.';
}
function kortNaam(naam) {
  if (!naam) return '?';
  const d = naam.trim().split(/\s+/);
  return d[0];
}
function initialen(naam) {
  if (!naam) return '?';
  const d = naam.trim().split(/\s+/);
  if (d.length === 1) return d[0][0].toUpperCase();
  return (d[0][0] + d[d.length - 1][0]).toUpperCase();
}
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Schermen ───────────────────────────────────────────────
function toon(id) {
  ['screen-loading','screen-login','screen-leeg','screen-score','screen-stand']
    .forEach(s => {
      const el = document.getElementById(s);
      if (s === id) { el.classList.remove('hidden'); }
      else          { el.classList.add('hidden'); }
    });
}
function toonScore() { toon('screen-score'); renderScoreScherm(); }
function toonStand() { toon('screen-stand'); renderStandScherm(); }

// ── Login / Logout ─────────────────────────────────────────
window.doLogin = async function() {
  const code  = String(document.getElementById('inp-code').value).trim();
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  if (!/^\d{4}$/.test(code)) { errEl.textContent = 'Vul een 4-cijferige code in'; return; }
  errEl.textContent = 'Zoeken…';
  try {
    const snap = await getDocs(collection(db, 'ladders'));
    let gevonden = null, gevLid = null;
    for (const d of snap.docs) {
      const match = (d.data().actievePartijen || []).find(p => p.partijCode === code);
      if (match) { gevonden = match; gevLid = d.id; break; }
    }
    if (!gevonden) { errEl.textContent = 'Code niet gevonden — controleer de Ronde tab'; return; }
    sessionStorage.setItem('watchCode', code);
    actievePartij = gevonden; ladderId = gevLid; holeIdx = 0;
    startCodeListener(code);
    toonScore();
  } catch(e) { errEl.textContent = 'Verbindingsfout — probeer opnieuw'; console.warn(e); }
};
window.doLogout = function() {
  if (ladderUnsub) { ladderUnsub(); ladderUnsub = null; }
  sessionStorage.removeItem('watchCode');
  actievePartij = null; ladderId = null;
  toon('screen-login');
};

// ── Opgeslagen code herstellen bij refresh ────────────────
(async () => {
  const opgeslagenCode = sessionStorage.getItem('watchCode');
  if (!opgeslagenCode) { toon('screen-login'); return; }
  toon('screen-loading');
  try {
    const snap = await getDocs(collection(db, 'ladders'));
    let gevonden = null, gevLid = null;
    for (const d of snap.docs) {
      const match = (d.data().actievePartijen || []).find(p => p.partijCode === opgeslagenCode);
      if (match) { gevonden = match; gevLid = d.id; break; }
    }
    if (gevonden) { actievePartij = gevonden; ladderId = gevLid; startCodeListener(opgeslagenCode); toonScore(); }
    else { sessionStorage.removeItem('watchCode'); toon('screen-login'); }
  } catch(e) { toon('screen-login'); }
})();

// ── Code listener — houdt partij live gesynchroniseerd ────
function startCodeListener(code) {
  if (ladderUnsub) { ladderUnsub(); ladderUnsub = null; }
  const unsubscribers = [];
  getDocs(collection(db, 'ladders')).then(snap => {
    for (const d of snap.docs) {
      const lid = d.id;
      const unsub = onSnapshot(doc(db, 'ladders', lid), s => {
        if (!s.exists()) return;
        const partijen = s.data().actievePartijen || [];
        alleLadderPartijen.set(lid, partijen); // altijd bijhouden
        const match = partijen.find(p => p.partijCode === code);
        if (match) {
          actievePartij = match; ladderId = lid;
          if (!document.getElementById('screen-score').classList.contains('hidden')) renderScoreScherm();
        } else {
          // Alleen resetten als code in GEEN enkele ladder meer bestaat
          const nogErgens = Array.from(alleLadderPartijen.values())
            .some(ps => ps.some(p => p.partijCode === code));
          if (!nogErgens) {
            sessionStorage.removeItem('watchCode');
            actievePartij = null; ladderId = null;
            toon('screen-leeg');
          }
        }
      });
      unsubscribers.push(unsub);
    }
    ladderUnsub = () => unsubscribers.forEach(u => u());
  });
}

// ── Score scherm renderen ──────────────────────────────────
function renderScoreScherm() {
  if (!actievePartij) { toon('screen-leeg'); return; }
  const p    = actievePartij;
  const hole = p.holes[holeIdx];
  if (!hole) return;

  document.getElementById('w-hn').textContent  = ((p.startHole - 1 + holeIdx) % 18) + 1;
  document.getElementById('w-par').textContent = hole.par;
  document.getElementById('w-si').textContent  = hole.si;
  const prevBtn = document.getElementById('btn-prev-hdr');
  if (prevBtn) { prevBtn.style.visibility = holeIdx > 0 ? 'visible' : 'hidden'; prevBtn.style.pointerEvents = holeIdx > 0 ? 'auto' : 'none'; }

  const container = document.getElementById('w-spelers');
  container.innerHTML = '';

  const alleNamen = p.spelers.map(s => s.naam);
  p.spelers.forEach(s => {
    const scores = Array.isArray(p.scores?.[s.uid]) ? p.scores[s.uid] : [];
    const val    = scores[holeIdx] ?? null;
    const filled = val !== null;

    const row = document.createElement('div');
    row.className = 'player-row' + (filled ? ' filled' : '');
    row.innerHTML = `
      <div class="av${filled ? ' done' : ''}">${esc(initialen(s.naam))}</div>
      <span class="pname${filled ? ' done' : ''}">${esc(kortNaamUniek(s.naam, alleNamen))}</span>
      <div class="score-ctrl">
        <button class="sc-btn" data-uid="${esc(s.uid)}" data-dir="-1">−</button>
        <span class="sc-num${filled ? ' done' : ''}">${filled ? val : '—'}</span>
        <button class="sc-btn" data-uid="${esc(s.uid)}" data-dir="1">+</button>
      </div>`;
    container.appendChild(row);
  });

  container.querySelectorAll('.sc-btn').forEach(btn => {
    btn.addEventListener('click', () => wijzigScore(btn.dataset.uid, parseInt(btn.dataset.dir)));
  });
}

// ── Score wijzigen ─────────────────────────────────────────
async function wijzigScore(uid, delta) {
  if (!actievePartij || !ladderId) return;
  const p    = actievePartij;
  const hole = p.holes[holeIdx];
  if (!hole) return;
  if (!p.scores) p.scores = {};
  if (!Array.isArray(p.scores[uid])) p.scores[uid] = Array(p.holes.length).fill(null);
  const huidig = p.scores[uid][holeIdx];
  // Eerste klik toont par, daarna past delta toe
  p.scores[uid][holeIdx] = huidig === null
    ? hole.par
    : Math.max(1, Math.min(12, huidig + delta));
  renderScoreScherm();
  // Schrijf direct terug — geen getDoc nodig, we hebben actievePartijen al lokaal
  try {
    const ladder = alleLadderPartijen.get(ladderId) || [];
    const partijen = ladder.map(ap =>
      ap.partijId === p.partijId ? { ...ap, scores: p.scores } : ap
    );
    await setDoc(doc(db, 'ladders', ladderId), { actievePartijen: partijen }, { merge: true });
  } catch(e) { console.warn('Score opslaan mislukt:', e); }
}

// ── Hole navigatie ─────────────────────────────────────────
window.volgendeHole = function() {
  if (!actievePartij) return;
  if (holeIdx < actievePartij.holes.length - 1) { holeIdx++; renderScoreScherm(); }
};
window.vorigeHole = function() {
  if (holeIdx > 0) { holeIdx--; renderScoreScherm(); }
};

// ── Stand scherm ───────────────────────────────────────────
function renderStandScherm() {
  if (!actievePartij) return;
  const p         = actievePartij;
  const resterend = p.holes.length - (holeIdx + 1);
  document.getElementById('w-stand-sub').textContent = `na hole ${holeIdx + 1}`;

  const container = document.getElementById('w-matches');
  container.innerHTML = '';

  (p.matchups || []).forEach(m => {
    const scoresA = Array.isArray(p.scores?.[m.spelerA.uid]) ? p.scores[m.spelerA.uid] : [];
    const scoresB = Array.isArray(p.scores?.[m.spelerB.uid]) ? p.scores[m.spelerB.uid] : [];

    let standA = 0, gespeeld = 0;
    for (let i = 0; i <= holeIdx; i++) {
      const sA = scoresA[i], sB = scoresB[i];
      if (sA == null || sB == null) continue;
      gespeeld++;
      if (sA < sB) standA++;
      else if (sB < sA) standA--;
    }

    const alleNamenStand = (actievePartij?.spelers || []).map(s => s.naam);
    const nA = kortNaamUniek(m.spelerA.naam, alleNamenStand);
    const nB = kortNaamUniek(m.spelerB.naam, alleNamenStand);
    const up = Math.abs(standA);

    // Tekst altijd vanuit perspectief speler A:
    // standA > 0 = A leidt → "X UP"
    // standA < 0 = A staat achter → "X DOWN"
    // standA = 0 = gelijk → "AS"
    let scoreText, sub;
    if (standA === 0) {
      scoreText = gespeeld === 0 ? '—' : 'AS';
      sub       = resterend > 0 ? `${resterend} te gaan` : 'Gelijkspel';
    } else if (standA > 0) {
      scoreText = up > resterend ? `${up}&${resterend}` : `${up} UP`;
      const leader = nA.split(' ')[0];
      sub = up > resterend ? `${leader} wint` : `${leader} · ${resterend} te gaan`;
    } else {
      scoreText = up > resterend ? `${up}&${resterend}` : `${up} DOWN`;
      const leader = nB.split(' ')[0];
      sub = up > resterend ? `${leader} wint` : `${leader} · ${resterend} te gaan`;
    }

    const card = document.createElement('div');
    card.className = 'match-card';
    card.innerHTML = `
      <div class="match-top">
        <span class="m-name${standA > 0 ? ' win' : ''}">${esc(nA)}</span>
        <span class="m-score">${esc(scoreText)}</span>
        <span class="m-name right${standA < 0 ? ' win' : ''}">${esc(nB)}</span>
      </div>
      <div class="m-sub">${esc(sub)}</div>`;
    container.appendChild(card);
  });
}

window.toonScore = toonScore;
window.toonStand = toonStand;
</script>
</body>
</html>
