<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Toernooi · Goyer Golf</title>
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap');
  :root {
    --green: #2d6a4f; --green-mid: #40916c; --green-pale: #d8f3dc;
    --gold: #b7950b; --gold-pale: #fef9e7;
    --border: #e8e4da; --bg: #f9f7f2; --light: #888; --mid: #555;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: #1a1a1a; }

  header {
    background: var(--green); color: white;
    padding: 16px 20px; display: flex; align-items: center;
    justify-content: space-between; position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 17px; font-weight: 700; }
  header .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  header .brand-logo { width: 34px; height: 34px; flex-shrink: 0; display: block; }
  header .meta { font-size: 12px; opacity: 0.7; margin-top: 2px; }
  .refresh-btn {
    background: rgba(255,255,255,0.15); border: none; color: white;
    padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px;
    font-family: 'DM Sans', sans-serif; font-weight: 600;
  }
  .refresh-btn:active { background: rgba(255,255,255,0.25); }

  main { max-width: 680px; margin: 0 auto; padding: 16px; }

  .card { background: white; border-radius: 14px; border: 1px solid var(--border); margin-bottom: 16px; overflow: hidden; }
  .card-header { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .card-header h2 { font-size: 15px; font-weight: 700; color: var(--green); }

  .ladder-item { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--border); }
  .ladder-item:last-child { border-bottom: none; }
  .rank-badge { width: 28px; height: 28px; border-radius: 50%; background: var(--border); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
  .rank-badge.top3 { background: var(--gold-pale); color: var(--gold); }
  .player-name { flex: 1; font-weight: 600; font-size: 14px; }

  .flight-header { padding: 10px 16px; background: var(--green-pale); font-size: 12px; font-weight: 700; color: var(--green); text-transform: uppercase; letter-spacing: 0.5px; }

  table { border-collapse: collapse; font-size: 12px; width: 100%; }
  th { background: var(--green); color: white; padding: 6px 8px; text-align: center; }
  th:first-child { text-align: left; }
  td { padding: 5px 8px; border-bottom: 1px solid var(--border); text-align: center; }
  td:first-child { text-align: left; font-weight: 600; }
  .score-eagle { background: #d4edda; }
  .score-birdie { background: #d8f3dc; }
  .score-bogey { background: #fff3cd; }
  .score-double { background: #f8d7da; }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .badge-green { background: var(--green-pale); color: var(--green); }
  .badge-gold { background: var(--gold-pale); color: var(--gold); }

  .empty { padding: 32px 16px; text-align: center; color: var(--light); }
  .loading { padding: 60px 16px; text-align: center; color: var(--light); font-size: 14px; }
  .tijd { font-size: 11px; color: var(--light); text-align: center; padding: 8px; }
  .fout { padding: 20px; text-align: center; color: #c0392b; background: #fde8e8; border-radius: 10px; margin: 16px; font-size: 14px; }

  .tab-bar { display: flex; gap: 8px; padding: 12px 16px 0; background: white; border-bottom: 1px solid var(--border); overflow-x: auto; }
  .tab-btn { padding: 8px 14px; border: 1.5px solid #000; border-radius: 6px; background: white; font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; text-transform: uppercase; }
  .tab-btn.actief { background: var(--green); border-color: var(--green); color: white; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <img src="logo.png" alt="Goyer MP Ladder" class="brand-logo">
    <div>
      <h1 id="toernooi-naam">Live Toernooi</h1>
      <div class="meta" id="toernooi-meta"></div>
    </div>
  </div>
  <button class="refresh-btn" onclick="laadData()">🟢 Live</button>
</header>

<div id="tab-bar" class="tab-bar" style="display:none">
  <button class="tab-btn actief" onclick="toonTab('scores')" id="tab-scores">Scores</button>
  <button class="tab-btn" onclick="toonTab('ranglijst')" id="tab-ranglijst">Ranglijst</button>
</div>

<main>
  <div id="inhoud"><div class="loading">⏳ Laden…</div></div>
  <div class="tijd" id="laatste-update"></div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, collection, query, where, getDocs, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { initializeAppCheck, ReCaptchaV3Provider } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app-check.js";

const firebaseConfig = {
  apiKey: "AIzaSyC6V0NOSgAtX_bDWezca-_F7gb3RANSens",
  authDomain: "goyer-golf-mp-ladder.firebaseapp.com",
  projectId: "goyer-golf-mp-ladder",
  storageBucket: "goyer-golf-mp-ladder.firebasestorage.app",
  messagingSenderId: "124116031878",
  appId: "1:124116031878:web:10d9b113b1afcd1dc73407"
};

const app = initializeApp(firebaseConfig);
// v3.0.0-11.100: App Check — reCAPTCHA v3 (vóór getFirestore)
initializeAppCheck(app, {
  provider: new ReCaptchaV3Provider('6LfOyhAtAAAAACKwXb70iOl_Pdrez2QQ_ktGhFSj'),
  isTokenAutoRefreshEnabled: true
});
const db = getFirestore(app);

let toernooiId = null;
let toernooiData = null;
let actiefTab = 'scores';
let _liveScoresMap = {}; // v3.0.0-11.106: { uid: { dagNr, scores, timestamp } }
let _liveUnsub = null;   // onSnapshot unsubscribe
let _docUnsub = null;    // main-doc onSnapshot unsubscribe

// v5.25.0: de dag die de KIJKER zelf aanklikt.
//
// WAT ER MIS WAS: de dagknop zette zijn keuze rechtstreeks in toernooiData en
// haalde daarna het toernooi opnieuw op. Die verse gegevens uit de database
// overschreven de keuze meteen weer — de kijker bleef op dezelfde dag hangen.
// Dezelfde overschrijving gebeurde bij elke real-time update van het
// hoofddocument. De keuze staat daarom nu apart en wordt na elke ophaalbeurt
// opnieuw toegepast. null = geen eigen keuze, dan volgt de kijker de dag die
// de coordinator actief heeft staan.
// v5.26.0: 0 betekent Totaal — de stand over alle dagen samen.
let gekozenDagNr = null;

function pasGekozenDagToe() {
  if (!toernooiData || !gekozenDagNr) return;   // null en 0 doen hier niets
  const aantal = (toernooiData.dagen || []).length;
  if (gekozenDagNr >= 1 && gekozenDagNr <= aantal) {
    toernooiData.actiefDagNr = gekozenDagNr;
  }
}

// ============================================================
//  ÉÉN DAGBALK VOOR DE HELE PAGINA  (v5.26.0)
// ============================================================
//  WAT ER MIS WAS. Er stonden TWEE rijen dagknoppen op het scherm: deze balk,
//  en een eigen rij binnen de ranglijstkaart. Die tweede rij was bovendien
//  dood — haar knoppen riepen `wisselRanglijstDag()` aan, maar dit script
//  draait als module, dus die naam bestaat niet op de pagina en elke klik liep
//  stuk. En juist in die dode rij zat de knop Totaal: de totaalstand was
//  daardoor helemaal niet te bereiken.
//
//  Nu is er één rij, hier, met de dagen én Totaal, en die bedient allebei de
//  tabbladen. De knoppen krijgen hun klik in JavaScript toegewezen (btn.onclick)
//  en niet als tekst in de HTML — dan kan het niet meer misgaan op modulescope.
//
//  ⚠ Een klik doet géén database-rondje meer. Bij een afgesloten toernooi valt
//  er niets nieuws op te halen; dat wachten voelde op een telefoon als een
//  knop die niet reageert.
function tekenKop() {
  if (!toernooiData) return;

  const dagen = toernooiData.dagen || [];
  const aantalDagen = dagen.length;
  const isAfgerond = toernooiData.status !== 'actief';
  const toonTotaal = gekozenDagNr === 0;

  // -- kopregel onder de toernooinaam --
  const actDag = dagen[(toernooiData.actiefDagNr || 1) - 1] || null;
  const baanLabel = actDag?.baan || toernooiData.baan || '';
  const datumLabel = actDag?.datum || toernooiData.datum || '';
  const staart = toonTotaal
    ? 'Totaal · alle dagen'
    : (aantalDagen > 1 ? `Dag ${toernooiData.actiefDagNr || 1} · ` : '') +
      baanLabel +
      (datumLabel ? ' · ' + new Date(datumLabel).toLocaleDateString('nl-NL', { day: 'numeric', month: 'long' }) : '');
  document.getElementById('toernooi-meta').textContent =
    (isAfgerond ? 'Einduitslag · ' : '') + staart;

  // -- dagbalk --
  // v5.25.0: eerst de oude balk weghalen, anders komt er elke keer een rij bij.
  const oudeDagBalk = document.getElementById('dag-tab-balk');
  if (oudeDagBalk) oudeDagBalk.remove();
  if (aantalDagen <= 1) return;

  const tabBar = document.getElementById('tab-bar');
  const balk = document.createElement('div');
  balk.id = 'dag-tab-balk';
  balk.style.cssText = 'display:flex;gap:4px;padding:8px 12px;background:var(--green-pale);border-bottom:1px solid var(--border);overflow-x:auto';

  const maakKnop = (tekst, actief, kleur, nr) => {
    const btn = document.createElement('button');
    btn.className = 'dag-tab';
    btn.textContent = tekst;
    btn.style.cssText = `padding:4px 12px;border-radius:16px;border:1.5px solid var(--${kleur});background:${actief ? `var(--${kleur})` : 'transparent'};color:${actief ? 'white' : `var(--${kleur})`};font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap`;
    btn.onclick = () => kiesDag(nr);
    return btn;
  };

  dagen.forEach(d => {
    const actief = !toonTotaal && d.dagNr === (toernooiData.actiefDagNr || 1);
    balk.appendChild(maakKnop(`Dag ${d.dagNr}${d.afgerond ? ' ✓' : ''}`, actief, 'green', d.dagNr));
  });
  balk.appendChild(maakKnop('Totaal', toonTotaal, 'gold', 0));

  tabBar.parentNode.insertBefore(balk, tabBar.nextSibling);
}

// Totaal bestaat alleen als ranglijst — losse holescores hebben geen totaal.
// Daarom springt de kijker daarbij mee naar het tabblad Ranglijst.
function kiesDag(nr) {
  gekozenDagNr = nr;
  pasGekozenDagToe();
  if (nr === 0 && actiefTab !== 'ranglijst') {
    actiefTab = 'ranglijst';
    markeerTabKnoppen();
  }
  tekenKop();
  renderInhoud();
}

function markeerTabKnoppen() {
  const scores = document.getElementById('tab-scores');
  const rang   = document.getElementById('tab-ranglijst');
  if (scores) scores.classList.toggle('actief', actiefTab === 'scores');
  if (rang)   rang.classList.toggle('actief',   actiefTab === 'ranglijst');
}

// Haal toernooi ID op uit URL
const params = new URLSearchParams(window.location.search);
toernooiId = params.get('t');

window.toonTab = function(tab) {
  actiefTab = tab;
  // v5.26.0: de knoppen worden op naam gemarkeerd. Voorheen ging dat via
  // `event.currentTarget` — dat werkt alleen bij een echte klik, en sinds de
  // dagbalk zelf naar Ranglijst kan springen moest het ook zonder klik kunnen.
  markeerTabKnoppen();
  // Terug naar Scores terwijl Totaal aan staat: losse holescores horen bij
  // één dag, dus dan valt de kijker terug op de dag die actief is.
  if (tab === 'scores' && gekozenDagNr === 0) {
    gekozenDagNr = toernooiData?.actiefDagNr || 1;
    tekenKop();
  }
  renderInhoud();
};

window.laadData = async function() {
  const btn = document.querySelector('.refresh-btn');
  if (btn) { btn.style.opacity = '0.5'; btn.style.pointerEvents = 'none'; }
  try {
    await laadToernooi();
  } finally {
    if (btn) { btn.style.opacity = ''; btn.style.pointerEvents = ''; }
  }
};

// ============================================================
//  WELK GETAL TELT — v5.44.0
// ------------------------------------------------------------
//  ⚠ KOPIE van scoreOordeel() uit js/toernooi.js, maar alleen het getal dat
//  MEETELT — deze pagina heeft de kleuren niet. Deze pagina staat bewust los van
//  de app: importeren zou de halve app meeslepen (config, store, auth) en dat
//  wil je niet op een scherm dat zonder inloggen open moet kunnen. De
//  rekentest-suite "Twee paar ogen & scorelagen" knipt beide kanten uit de bron
//  en legt ze naast elkaar; lopen ze uit de pas, dan valt die test om.
//  Wijzig je hier iets, wijzig het dan ook in js/toernooi.js.
//
//  ⚠ WAT ER MIS WAS (gemeld door Sierk, 25 september 2026). Deze pagina las
//  alleen de laag `dagen` — wat een speler ZELF intikte — en negeerde
//  `markerDagen` (een medespeler uit zijn flight) en `beheerDagen` (de
//  wedstrijdleiding). De drie lagen bestaan sinds v5.11.0; deze pagina is toen
//  niet meegenomen.
//
//  Zolang iedereen zijn eigen kaart invulde stond het getal toevallig in de laag
//  waar deze pagina in keek. Sinds v5.43.0 houdt vaak één iemand de kaart van de
//  hele flight bij — dan komt het in `markerDagen` terecht en bleef deze pagina
//  leeg tot "dag afsluiten". Ook een score die de wedstrijdleiding vaststelde
//  was hier onzichtbaar.
// ============================================================
function tellendGetal(spelerWaarde, markerWaarde, beheerWaarde) {
  const leeg = (v) => v === null || v === undefined || v === '';
  const bh = leeg(beheerWaarde) ? null : Number(beheerWaarde);
  if (bh !== null) return bh;          // de wedstrijdleiding heeft het laatste woord
  const sp = leeg(spelerWaarde) ? null : Number(spelerWaarde);
  const mk = leeg(markerWaarde) ? null : Number(markerWaarde);
  return sp !== null ? sp : mk;        // anders de speler; is die er niet, zijn flight
}

// Eén laag van één dag uit een live-document, altijd als array.
function laagVanDagLive(data, laag, dagNr) {
  const perDag = data?.[laag]?.[String(dagNr)];
  if (Array.isArray(perDag)) return perDag;
  // v5.3.0-formaat: één losse dag naast `dagen`. Gold alleen voor de speler.
  if (laag === 'dagen' && data?.dagNr === dagNr && Array.isArray(data.scores)) return data.scores;
  return [];
}

// v3.0.0-11.106: helper — geeft de scores terug voor een dag,
// met live/-subcollectie als prioriteit boven dag.scores.
function getLiveScoresVoorDag(dag) {
  if (!dag) return {};
  const result = { ...(dag.scores || {}) };
  Object.keys(_liveScoresMap).forEach(uid => {
    const e = _liveScoresMap[uid] || {};
    const speler = laagVanDagLive(e, 'dagen',       dag.dagNr);
    const marker = laagVanDagLive(e, 'markerDagen', dag.dagNr);
    const beheer = laagVanDagLive(e, 'beheerDagen', dag.dagNr);
    const lengte = Math.max(speler.length, marker.length, beheer.length);
    if (lengte === 0) return;   // deze speler heeft niets voor deze dag
    const rij = [];
    for (let i = 0; i < lengte; i++) rij.push(tellendGetal(speler[i], marker[i], beheer[i]));
    result[uid] = rij;
  });
  return result;
}

async function laadToernooi() {
  try {
    if (!toernooiId) {
      // Zoek actief toernooi
      const q = query(collection(db, 'toernooien'), where('status', '==', 'actief'));
      const snap = await getDocs(q);
      if (snap.empty) {
        document.getElementById('inhoud').innerHTML = '<div class="fout">Geen actief toernooi gevonden.</div>';
        return;
      }
      toernooiId = snap.docs[0].id;
      toernooiData = snap.docs[0].data();
      pasGekozenDagToe();
    } else {
      const snap = await getDoc(doc(db, 'toernooien', toernooiId));
      if (!snap.exists()) {
        document.getElementById('inhoud').innerHTML = '<div class="fout">Toernooi niet gevonden.</div>';
        return;
      }
      toernooiData = snap.data();
      pasGekozenDagToe();
    }

    // v5.10.0: een AFGESLOTEN toernooi hoort hier gewoon te staan.
    //
    // WAT ER MIS WAS: hier stond `!== 'actief' && !== 'afgelopen'`. De app zet
    // een afgesloten toernooi op 'afgerond' — dat woord stond er niet bij, en
    // 'afgelopen' komt in de rest van de code nergens voor (overgebleven oude
    // naam; er staan nog twee oude toernooien mee in de database). Gevolg: op
    // het moment dat de uitslag definitief werd, weigerde de meekijklink hem.
    // Precies andersom dan bedoeld: juist dán wil je hem doorsturen.
    //
    // 'geannuleerd' blijft geweigerd — dat toernooi is niet gespeeld.
    const zichtbareStatus = ['actief', 'afgelopen', 'afgerond'];
    if (!zichtbareStatus.includes(toernooiData.status)) {
      document.getElementById('inhoud').innerHTML = '<div class="fout">Dit toernooi is niet beschikbaar.</div>';
      return;
    }

    // v5.10.0: de coordinator kan de link achteraf dichtzetten. De database
    // weigert het document dan al voor wie niet is ingelogd — deze controle is
    // alleen voor de nette melding, niet de beveiliging.
    if (toernooiData.publiek === false) {
      document.getElementById('inhoud').innerHTML = '<div class="fout">De uitslag van dit toernooi is niet meer openbaar.</div>';
      return;
    }

    const isAfgerond = toernooiData.status !== 'actief';

    document.getElementById('toernooi-naam').textContent = toernooiData.naam;

    // v5.10.0: bij een afgesloten toernooi is er niets meer live. De knop
    // 'Live' die om de tien seconden ververst zou dan een leugen zijn.
    const verversKnop = document.querySelector('.refresh-btn');
    if (verversKnop && isAfgerond) verversKnop.style.display = 'none';
    document.getElementById('tab-bar').style.display = 'flex';

    tekenKop();

    updateTijd();
    renderInhoud();

    // v3.0.0-11.106: start real-time listeners
    // v5.10.0: alleen zolang er nog gespeeld wordt.
    if (!isAfgerond) startLiveListeners();
  } catch(e) {
    console.error('Laden mislukt:', e);
    document.getElementById('inhoud').innerHTML = '<div class="fout">Laden mislukt. Controleer je verbinding.</div>';
  }
}

function updateTijd() {
  document.getElementById('laatste-update').textContent =
    'Bijgewerkt: ' + new Date().toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

// v3.0.0-11.106: real-time listeners op live/ subcollectie en hoofddocument
function startLiveListeners() {
  // Stop bestaande listeners
  if (_liveUnsub) { _liveUnsub(); _liveUnsub = null; }
  if (_docUnsub) { _docUnsub(); _docUnsub = null; }
  if (!toernooiId) return;

  // Listener op live/ subcollectie — real-time scores
  _liveUnsub = onSnapshot(
    collection(db, 'toernooien', toernooiId, 'live'),
    (snap) => {
      _liveScoresMap = {};
      snap.docs.forEach(d => { _liveScoresMap[d.id] = d.data(); });
      updateTijd();
      renderInhoud();
    },
    (err) => { console.warn('live/ listener error:', err.code); }
  );

  // Listener op hoofddocument — structurele wijzigingen (flights, dag afsluiten, etc.)
  _docUnsub = onSnapshot(
    doc(db, 'toernooien', toernooiId),
    (snap) => {
      if (!snap.exists()) return;
      toernooiData = snap.data();
      pasGekozenDagToe();
      updateTijd();
      renderInhoud();
    },
    (err) => { console.warn('doc listener error:', err.code); }
  );
}

function renderInhoud() {
  if (actiefTab === 'scores') renderScores();
  else renderRanglijst();
}

function renderScores() {
  const t = toernooiData;
  // v3.0.0-11.37: haal data uit actieve dag
  const dag = (t.dagen || [])[(t.actiefDagNr || 1) - 1] || null;
  const holes   = dag?.holes   || t.holes   || [];
  const flights = dag?.flights || t.flights || [{ naam: 'Flight', spelerIds: t.spelers.map(s => s.uid) }];
  // v3.0.0-11.106: merge live scores met dag.scores
  const scores  = dag ? getLiveScoresVoorDag(dag) : (t.scores || {});
  let html = '';

// ============================================================
//  KORTE, UNIEKE NAMEN — v5.11.9
// ============================================================
//  ⚠ Dit is een KOPIE van kortNaam() uit js/partij.js. Deze pagina staat
//  bewust los van de app: importeren zou de halve app meeslepen (config,
//  store, auth) en dat wil je niet op een scherm dat zonder inloggen open moet
//  kunnen. De rekentest-suite "Korte unieke namen" knipt beide kanten uit de
//  bron en legt ze naast elkaar; lopen ze uit de pas, dan valt die test om.
//  Wijzig je hier iets, wijzig het dan ook in js/partij.js.
// ============================================================
function splitsNaam(volleNaam) {
  const voorvoegsels = new Set(
    ['van','de','den','der','het','te','ter','ten','op','in','aan','bij']);
  const delen = String(volleNaam || '').trim().split(/\s+/);
  const voornaam = delen[0] || '';
  let i = 1;
  while (i < delen.length - 1 && voorvoegsels.has(delen[i].toLowerCase())) i++;
  return { voornaam, achternaam: delen.slice(i).join(' ') };
}

function kortNaam(speler, alleSpelers) {
  const { voornaam, achternaam } = splitsNaam(speler.naam);

  const gelijkeVoornaam = (alleSpelers || []).filter(s =>
    s.uid !== speler.uid &&
    splitsNaam(s.naam).voornaam.toLowerCase() === voornaam.toLowerCase());
  if (gelijkeVoornaam.length === 0) return voornaam;

  const anderen = gelijkeVoornaam.map(s => splitsNaam(s.naam).achternaam);
  for (let i = 1; i <= achternaam.length; i++) {
    const stuk = achternaam.slice(0, i);
    if (!anderen.some(a => a.slice(0, i) === stuk)) return voornaam + ' ' + stuk;
  }
  return speler.naam;
}

function kortNaamMap(spelers) {
  const map = {};
  spelers.forEach(s => { map[s.uid] = kortNaam(s, spelers); });
  return map;
}

  flights.forEach(flight => {
    const flightSpelers = t.spelers.filter(s => (flight.spelerIds || []).map(String).includes(String(s.uid)));
    if (flightSpelers.length === 0) return;

    html += `<div class="card">
      <div class="flight-header">✈️ ${flight.naam}${flight.starttijd ? ' · ' + flight.starttijd : ''}${flight.starthole && flight.starthole > 1 ? ' · start hole ' + flight.starthole : ''}</div>
      <div style="overflow-x:auto"><table>
        <thead><tr>
          <th>Hole</th>
          ${(nm => flightSpelers.map(s => `<th>${nm[s.uid]}</th>`).join(''))(kortNaamMap(flightSpelers))}
        </tr></thead>
        <tbody>`;

    holes.forEach((hole, i) => {
      html += `<tr>
        <td style="white-space:nowrap">
          <span style="font-weight:700">${i+1}</span>
          <span style="font-size:10px;color:var(--light);margin-left:3px">p${hole.par}</span>
        </td>`;
      flightSpelers.forEach(s => {
        const sScores = scores?.[s.uid] || scores?.[String(s.uid)] || [];
        const val = sScores[i];
        let cls = '';
        if (val != null) {
          if (val <= hole.par - 2) cls = 'score-eagle';
          else if (val === hole.par - 1) cls = 'score-birdie';
          else if (val === hole.par + 1) cls = 'score-bogey';
          else if (val >= hole.par + 2) cls = 'score-double';
        }
        html += `<td class="${cls}">${val != null ? val : '—'}</td>`;
      });
      html += '</tr>';
    });

    // Totaalrij
    html += '<tr style="background:var(--green-pale);font-weight:700"><td>Totaal</td>';
    flightSpelers.forEach(s => {
      const sScores = scores?.[s.uid] || scores?.[String(s.uid)] || [];
      const filled = sScores.filter(v => v != null);
      const tot = filled.length ? filled.reduce((a,b) => a+Number(b), 0) : null;
      html += `<td>${tot !== null ? tot : '—'}</td>`;
    });
    html += '</tr></tbody></table></div></div>';
  });

  html += prijzenHtmlLive(t, dag);

  document.getElementById('inhoud').innerHTML = html || '<div class="empty">Geen scores.</div>';
}

// ============================================================
//  HANDMATIGE PRIJZEN — v5.44.0
// ------------------------------------------------------------
//  Longest, Neary en Leary staan per DAG in het toernooidocument
//  (`dag.prijzen`), dus deze pagina had ze al binnen — er werd alleen niets mee
//  getekend. Sierk, 25 september 2026: ze mogen ook hier staan.
//
//  ⚠ Alleen wat is INGEVULD. Een leeg vak zou de indruk geven dat er nog prijzen
//  komen; een regel zonder hole of zonder speler is niets waard en wordt
//  overgeslagen. Staat er niets, dan staat er ook geen kop.
//
//  ⚠ Dit is de kant van de MEEKIJKER. De wedstrijdleiding vult ze in op haar
//  eigen scherm (prijzenVakHtml() in js/toernooi.js); dit is alleen lezen.
//
//  ⚠ Alles gaat door escLive(). Een spelersnaam wordt door de wedstrijdleiding
//  ingetikt — bij een gast helemaal — en komt hier op een OPENBARE pagina
//  terecht. Zelfde reden als bij de teamnamen in v5.42.0.
// ============================================================
const PRIJS_SOORTEN_LIVE = [
  { key: 'longest', label: 'Longest' },
  { key: 'neary',   label: 'Neary' },
  { key: 'leary',   label: 'Leary' },
];

function prijzenHtmlLive(t, dag) {
  if (!dag) return '';
  const naamVan = (uid) => (t.spelers || []).find(sp => String(sp.uid) === String(uid))?.naam || '';
  const regels = [];
  for (const soort of PRIJS_SOORTEN_LIVE) {
    const rijen = Array.isArray(dag.prijzen?.[soort.key]) ? dag.prijzen[soort.key] : [];
    for (const rij of rijen) {
      const naam = naamVan(rij?.uid);
      if (!rij?.hole || !naam) continue;
      regels.push({ label: soort.label, hole: rij.hole, naam });
    }
  }
  if (regels.length === 0) return '';
  return `<div class="card">
      <div class="flight-header">🏆 Prijzen</div>
      <div style="overflow-x:auto"><table>
        <thead><tr><th style="text-align:left">Prijs</th><th>Hole</th><th style="text-align:left">Speler</th></tr></thead>
        <tbody>
          ${regels.map(r => `<tr>
            <td style="text-align:left">${escLive(r.label)}</td>
            <td>${escLive(r.hole)}</td>
            <td style="text-align:left">${escLive(r.naam)}</td>
          </tr>`).join('')}
        </tbody>
      </table></div>
    </div>`;
}

// v3.0.0-11.37: berekening per dag, met totaal-optie (dagNr=0)
function actieveDagLive(t, dagNrOverride) {
  const dagNr = dagNrOverride !== undefined ? dagNrOverride : (t.actiefDagNr || 1);
  return (t.dagen || [])[dagNr - 1] || null;
}

// ============================================================
//  v5.42.0 — DE TEAMSTAND (LETTERLIJKE KOPIE UIT js/toernooi.js)
// ------------------------------------------------------------
//  ⚠ NIET AANPASSEN ZONDER js/toernooi.js MEE TE NEMEN. Deze pagina staat
//  bewust los van de app — hij moet openen zonder inloggen en kan de modules
//  van de app dus niet importeren, net als bij kortNaam() (v5.11.9) en de
//  gastlogins (v5.11.7). De suite "Toernooi" knipt beide kopieën uit de bron
//  en legt ze naast elkaar; lopen ze uit de pas, dan valt die test om.
//
//  ⚠ Deze pagina kent alleen bruto, netto en stableford. Dagpunten vragen de
//  hele matchplay-motor, en die staat hier niet. Bij een toernooi met een
//  matchplay-dag wordt hier dus geen teamstand getoond — precies zoals het
//  klassement daar ook niet wordt getoond.
// ============================================================
function teamStand(teams, spelers, perDagScores, opties) {
  const hoogWint = opties?.hoogWint !== false;
  const teamsLijst = Array.isArray(teams) ? teams : [];
  const sp = Array.isArray(spelers) ? spelers : [];
  const dagen = Array.isArray(perDagScores) ? perDagScores : [];

  const ledenVan = new Map();
  teamsLijst.forEach(team => ledenVan.set(team.id, []));
  sp.forEach((s, i) => {
    if (s && ledenVan.has(s.teamId)) ledenVan.get(s.teamId).push(i);
  });

  const grootste = teamsLijst.reduce((m, team) => Math.max(m, ledenVan.get(team.id).length), 0);
  const gevraagd = Number(opties?.besteN);
  const n = (Number.isFinite(gevraagd) && gevraagd > 0) ? Math.floor(gevraagd) : grootste;

  const uit = teamsLijst.map(team => ({
    id: team.id,
    naam: team.naam,
    leden: ledenVan.get(team.id).length,
    telt: n,                    // hoeveel scores er per dag meetellen
    perDag: [],
    totaal: 0,
  }));

  dagen.forEach(scores => {
    const lijst = Array.isArray(scores) ? scores : [];
    const geldig = lijst.filter(v => Number.isFinite(v));
    const slechtste = hoogWint ? 0 : (geldig.length ? Math.max.apply(null, geldig) : 0);

    uit.forEach(team => {
      const eigen = ledenVan.get(team.id)
        .map(i => lijst[i])
        .filter(v => Number.isFinite(v))
        .sort((a, b) => hoogWint ? b - a : a - b);
      while (eigen.length < n) eigen.push(slechtste);
      const dagTotaal = eigen.slice(0, n).reduce((som, v) => som + v, 0);
      team.perDag.push(dagTotaal);
      team.totaal += dagTotaal;
    });
  });

  uit.sort((a, b) => hoogWint ? b.totaal - a.totaal : a.totaal - b.totaal);
  return uit;
}

// v5.42.0: de teamstand op de meekijkpagina. Volgt de dag en de kolom die de
// bezoeker bekijkt (bruto / netto / stableford), met dezelfde regel als in de
// app: per dag de beste N, dan de dagen opgeteld.
function teamStandHtmlLive(t, rlDagNr, sorteerOp) {
  const teams = teamsVanLive(t);
  if (teams.length === 0) return '';

  const hoogWint = sorteerOp === 'stableford';
  const dagen = rlDagNr === 0 ? (t.dagen || []) : [actieveDagLive(t, rlDagNr)].filter(Boolean);
  const perDagScores = dagen.map(dag => {
    const res = berekenStrokeplayRanglijst(t, dag.dagNr);
    return (t.spelers || []).map((s, i) => {
      const r = res[i];
      return (r && r.holes > 0) ? r[sorteerOp] : null;
    });
  });

  const stand = teamStand(teams, t.spelers || [], perDagScores, { hoogWint, besteN: t.teamBesteN });
  if (stand.length === 0) return '';

  const label = { brutto: 'bruto slagen', netto: 'netto slagen', stableford: 'stableford' }[sorteerOp] || 'bruto slagen';
  const wat = rlDagNr === 0 ? 'Totaal' : `Dag ${rlDagNr}`;

  let h = `<div style="font-size:11px;color:#777;padding:6px 10px;border-bottom:1px solid #ddd">
    <strong>Teams &middot; ${escLive(wat)}</strong> &middot; op ${escLive(label)} (${hoogWint ? 'hoogste' : 'laagste'} wint) &middot; beste ${stand[0].telt} per dag
  </div>`;
  h += '<div style="overflow-x:auto"><table style="border-collapse:collapse;width:100%;margin-bottom:10px"><tbody>';
  stand.forEach((team, i) => {
    h += `<tr style="${i % 2 ? 'background:#f7f7f5' : ''}">
      <td style="padding:6px 4px;text-align:center;font-size:12px;width:24px;font-weight:700">${i + 1}</td>
      <td style="padding:6px 8px;font-size:13px;font-weight:600">${escLive(team.naam)}</td>
      <td style="padding:6px 4px;text-align:center;font-size:11px;color:#777">${team.leden}</td>
      <td style="padding:6px 8px;text-align:right;font-size:13px;font-weight:700;font-family:monospace">${team.totaal}</td>
    </tr>`;
  });
  h += '</tbody></table></div>';
  return h;
}

// v5.42.0: deze pagina zette tot nu toe alles rechtstreeks in de HTML. Een
// teamnaam wordt door de wedstrijdleiding ingetikt en komt op een OPENBARE
// pagina terecht, dus die gaat hier wel door een ontsnapping heen. De rest van
// de pagina is bewust niet omgebouwd — dat is een aparte opruiming.
function escLive(v) {
  return String(v ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function teamsVanLive(t) {
  return Array.isArray(t?.teams) ? t.teams : [];
}

function berekenStrokeplayRanglijst(t, dagNrOverride) {
  // dagNrOverride=0 → totaal over alle dagen
  if (dagNrOverride === 0) {
    return t.spelers.map(s => {
      let bruttoTot = 0, nettoTot = 0, sfTot = 0, holesTot = 0;
      (t.dagen || []).forEach(dag => {
        const r = berekenStrokeplayRanglijst(t, dag.dagNr).find(x => x.s === s);
        if (r && r.holes > 0) { bruttoTot += r.brutto||0; nettoTot += r.netto||0; sfTot += r.stableford||0; holesTot += r.holes; }
      });
      return { s, holes: holesTot, brutto: holesTot>0?bruttoTot:null, netto: holesTot>0?nettoTot:null, stableford: holesTot>0?sfTot:null };
    });
  }
  const dag = actieveDagLive(t, dagNrOverride);
  const holes  = dag?.holes  || t.holes  || [];
  // v3.0.0-11.106: merge live scores
  const scores = dag ? getLiveScoresVoorDag(dag) : (t.scores || {});
  const aantalHoles = holes.length;
  return t.spelers.map(s => {
    const sScores = scores?.[s.uid] || scores?.[String(s.uid)] || [];
    const hcp = Math.round(s.hcp);
    let bruttoTotaal = 0, nettoSlagen = 0, stableford = 0, holesGespeeld = 0;
    holes.forEach((hole, i) => {
      const val = sScores[i];
      if (val == null) return;
      holesGespeeld++;
      const v = Number(val);
      bruttoTotaal += v;
      const slag = (hole.si <= Math.min(hcp, aantalHoles) ? 1 : 0) +
                   (hole.si <= Math.max(0, hcp - aantalHoles) ? 1 : 0);
      nettoSlagen += slag;
      const diff = hole.par - (v - slag);
      stableford += Math.max(0, diff + 2);
    });
    return {
      s,
      holes: holesGespeeld,
      brutto: holesGespeeld > 0 ? bruttoTotaal : null,
      netto: holesGespeeld > 0 ? bruttoTotaal - nettoSlagen : null,
      stableford: holesGespeeld > 0 ? stableford : null,
    };
  });
}

function renderRanglijst() {
  const t = toernooiData;
  const dag = actieveDagLive(t);
  const holes  = dag?.holes  || t.holes  || [];
  // v3.0.0-11.106: merge live scores
  const scores = dag ? getLiveScoresVoorDag(dag) : (t.scores || {});
  const dagNr  = t.actiefDagNr || 1;

  // v5.26.0: hier stond een TWEEDE rij dagknoppen, met de enige knop Totaal die
  // de pagina had. Zie de toelichting bij tekenKop(): die rij was dood en staat
  // nu als één balk bovenaan. Welke dag getoond wordt, komt dus van daar.
  const rlDagNr = gekozenDagNr === 0 ? 0 : dagNr;
  const rlHoles  = rlDagNr === 0 ? holes : (actieveDagLive(t, rlDagNr)?.holes  || holes);
  const rlDag    = rlDagNr === 0 ? null : actieveDagLive(t, rlDagNr);
  const rlScores = rlDag ? getLiveScoresVoorDag(rlDag) : scores;

  let html = '<div class="card">';

  if (t.modus === 'strokeplay') {
    const sorteerOp = t._ranglijstModus || 'brutto';
    html += teamStandHtmlLive(t, rlDagNr, sorteerOp);
    const sorteerLabel = { brutto: 'Brutto (laag wint)', netto: 'Netto (laag wint)', stableford: 'Stableford (hoog wint)' }[sorteerOp] || 'Brutto (laag wint)';
    const dagNaam = rlDagNr === 0 ? 'Totaal' : `Dag ${rlDagNr}`;

    const resultaten = berekenStrokeplayRanglijst(t, rlDagNr === 0 ? 0 : rlDagNr)
      .filter(r => r.holes > 0)
      .sort((a, b) => {
        const va = sorteerOp === 'stableford' ? -(a.stableford ?? -999) : (a[sorteerOp] ?? 999);
        const vb = sorteerOp === 'stableford' ? -(b.stableford ?? -999) : (b[sorteerOp] ?? 999);
        return va - vb;
      });

    const totHoles = rlDagNr === 0
      ? (t.dagen || []).reduce((s, d) => s + d.holes.length, 0)
      : rlHoles.length;

    html += `<div class="card-header"><h2>Ranglijst · ${dagNaam}</h2><span class="badge badge-green">Strokeplay</span></div>`;
    html += `<div style="font-size:11px;color:var(--light);padding:6px 10px;border-bottom:1px solid var(--border)">Gesorteerd op: <strong style="color:var(--green)">${sorteerLabel}</strong></div>`;

    if (resultaten.length === 0) {
      html += '<div class="empty">Nog geen scores ingevoerd.</div>';
    } else {
      const thS = 'padding:6px 4px;background:var(--green);color:white;text-align:center;font-size:11px;white-space:nowrap';
      const tdS = 'padding:6px 4px;text-align:center;font-size:12px;font-family:monospace;border-bottom:1px solid var(--border)';
      const tdN = 'padding:6px 8px;font-size:13px;font-weight:600;border-bottom:1px solid var(--border);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
      html += '<div style="overflow-x:auto"><table style="border-collapse:collapse;width:100%"><thead><tr>';
      html += `<th style="${thS};text-align:left;width:20px">#</th>`;
      html += `<th style="${thS};text-align:left">Naam</th>`;
      html += `<th style="${thS}">Holes</th>`;
      const actS = (col) => sorteerOp === col ? ';background:#1e4d38' : '';
      html += `<th style="${thS}${actS('brutto')}">Brutto${sorteerOp === 'brutto' ? ' ↑' : ''}</th>`;
      html += `<th style="${thS}${actS('netto')}">Netto${sorteerOp === 'netto' ? ' ↑' : ''}</th>`;
      html += `<th style="${thS}${actS('stableford')}">Stableford${sorteerOp === 'stableford' ? ' ↓' : ''}</th>`;
      html += '</tr></thead><tbody>';
      resultaten.forEach((r, rank) => {
        html += `<tr style="${rank % 2 ? 'background:#fafaf8' : ''}">
          <td style="${tdS};font-weight:700;color:${rank < 3 ? 'var(--gold)' : 'var(--light)'}">${rank+1}</td>
          <td style="${tdN}">${r.s.naam}</td>
          <td style="${tdS};color:var(--light);font-size:11px">${r.holes}/${totHoles}</td>
          <td style="${tdS}">${r.brutto ?? '—'}</td>
          <td style="${tdS}">${r.netto ?? '—'}</td>
          <td style="${tdS}">${r.stableford !== null ? r.stableford + ' pt' : '—'}</td>
        </tr>`;
      });
      html += '</tbody></table></div>';
    }
  } else {
    // Matchplay tussenstand
    const dagNaam = rlDagNr === 0 ? 'Totaal' : `Dag ${rlDagNr}`;
    html += `<div class="card-header"><h2>Matchplay · ${dagNaam}</h2></div>`;
    const spelers = t.spelers;
    const n = spelers.length;
    let aantalMatchups = 0;

    for (let i = 0; i < n; i++) {
      for (let j = i + 1; j < n; j++) {
        const sA = spelers[i], sB = spelers[j];
        const scoresA = rlScores?.[sA.uid] || rlScores?.[String(sA.uid)] || [];
        const scoresB = rlScores?.[sB.uid] || rlScores?.[String(sB.uid)] || [];
        // v5.8.9: de stand wordt BEVROREN op het moment dat de partij beslist
        // is. Wie op hole 15 met 4 voor en 3 te gaan heeft gewonnen, wint 4&3 —
        // ook als het gezelschap daarna doortelt tot hole 18. Voorheen rekende
        // dit scherm pas aan het eind en stond er dan '7&0', een score die in
        // golftaal niet bestaat. Zelfde regel als in js/ronde.js.
        let standA = 0, gespeeld = 0, beslissingsStand = null, beslissingsGespeeld = null;
        rlHoles.forEach((hole, hi) => {
          const vA = scoresA[hi], vB = scoresB[hi];
          if (vA == null || vB == null) return;
          gespeeld++;
          if (Number(vA) < Number(vB)) standA++;
          else if (Number(vB) < Number(vA)) standA--;
          if (beslissingsStand === null && Math.abs(standA) > rlHoles.length - gespeeld) {
            beslissingsStand = standA; beslissingsGespeeld = gespeeld;
          }
        });
        const beslist = beslissingsStand !== null;
        const effStand = beslist ? beslissingsStand : standA;
        const resterend = rlHoles.length - (beslist ? beslissingsGespeeld : gespeeld);
        let status = '';
        if (gespeeld === 0) status = 'Niet begonnen';
        else if (effStand === 0) status = 'TIED';
        else if (beslist) status = `${effStand > 0 ? sA.naam : sB.naam} wint ${Math.abs(effStand)}${resterend > 0 ? '&' + resterend : ' up'}`;
        else status = `${effStand > 0 ? sA.naam.split(' ')[0] : sB.naam.split(' ')[0]} ${Math.abs(effStand)} UP`;

        html += `<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border)">
          <span style="font-size:13px">${sA.naam} vs ${sB.naam}</span>
          <span class="badge badge-green">${status}</span>
        </div>`;
        aantalMatchups++;
      }
    }
    if (aantalMatchups === 0) html += '<div class="empty">Geen matchups.</div>';
  }

  html += '</div>';
  document.getElementById('inhoud').innerHTML = html;
}

// Start
laadToernooi();
